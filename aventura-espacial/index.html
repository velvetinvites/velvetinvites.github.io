function planet(x,y,r,g,ring){let o='<g transform="translate('+x+' '+y+')" filter="url(#ds3)">';if(ring)o+='<ellipse rx="'+(r*1.9)+'" ry="'+(r*.5)+'" fill="none" stroke="url(#gold)" stroke-width="'+(r*.18)+'" transform="rotate(-18)" opacity=".9"/>';o+='<circle r="'+r+'" fill="url(#'+g+')"/><path d="M'+(-r*.8)+','+(-r*.2)+' Q0,'+(r*.1)+' '+(r*.8)+','+(-r*.35)+'" stroke="#fff" stroke-width="'+(r*.08)+'" opacity=".35" fill="none"/>';if(ring)o+='<path d="M'+(-r*1.8)+','+(r*.05)+' A'+(r*1.9)+','+(r*.5)+' 0 0 0 '+(r*1.8)+','+(-r*.6)+'" fill="none" stroke="url(#gold)" stroke-width="'+(r*.18)+'" opacity=".95"/>';return o+'</g>';}
function rocket(x,y,s,rot){return '<g class="fly"><g transform="translate('+x+' '+y+') rotate('+rot+') scale('+s+')" filter="url(#ds3)"><path class="flm" d="M-5,14 Q0,30 5,14Z" fill="#ffb347"/><path class="flm" d="M-3,14 Q0,24 3,14Z" fill="#fff3b0"/><path d="M-8,6 L-14,16 L-6,13Z" fill="#c9403a"/><path d="M8,6 L14,16 L6,13Z" fill="#c9403a"/><path d="M0,-22 C10,-12 10,6 7,14 L-7,14 C-10,6 -10,-12 0,-22Z" fill="#eef2fa" stroke="#9aa8c8" stroke-width=".6"/><path d="M0,-22 C4,-18 6,-14 7,-11 L-7,-11 C-6,-14 -4,-18 0,-22Z" fill="#c9403a"/><circle cy="-2" r="4" fill="#3a6ad0" stroke="url(#gold)" stroke-width="1.4"/><circle cx="-1.2" cy="-3.2" r="1.2" fill="#fff" opacity=".7"/></g></g>';}
function moon(x,y,r){return '<g transform="translate('+x+' '+y+')" filter="url(#glow)"><path d="M0,'+(-r)+' A'+r+','+r+' 0 1 0 0,'+r+' A'+(r*.75)+','+(r*.85)+' 0 1 1 0,'+(-r)+'Z" fill="url(#moon)"/></g>';}
$('envst').innerHTML=dots(40,300,210);$('flst').innerHTML=dots(18,300,110);
$('spr').innerHTML=planet(4,4,16,'pl1',true)+planet(28,-10,7,'pl3')+star(-14,26,.8)+planet(296,206,14,'pl2',true)+star(276,222,.7)+moon(318,180,10)+rocket(262,-22,1,35);
$('hol').innerHTML=star(52,92,1)+star(62,84,.6)+star(46,104,.5);
$('cnL').innerHTML=planet(22,20,15,'pl1',true)+planet(52,10,6,'pl3')+star(70,30,.7,'url(#gold)')+star(10,48,.6,'url(#gold)');
$('cnR').innerHTML=rocket(80,58,1.1,30)+planet(44,74,9,'pl2')+star(100,30,.7,'url(#gold)')+star(24,58,.6,'url(#gold)');
let ss=dots(60,388,420);[[30,60,1],[358,50,1.2],[350,250,.8],[24,280,1.1],[194,30,.9],[300,120,.7],[80,140,.6],[340,360,.9],[40,380,.7],[200,400,.6]].forEach((s,i)=>{ss+=star(s[0],s[1],s[2],'#FBE3A8',1,(i*.37).toFixed(2));});ss+=moon(340,90,16)+planet(46,330,10,'pl3');$('stars').innerHTML=ss;
function paint(){document.querySelectorAll('[data-t]').forEach(e=>e.textContent=T[lang][e.dataset.t]);document.querySelectorAll('.lg button').forEach(b=>b.classList.toggle('on',b.dataset.l===lang));if(D)fill();}
document.querySelectorAll('.lg button').forEach(b=>b.onclick=()=>{lang=b.dataset.l;paint();});
function fill(){const d=D,dt=new Date(d.d+'T'+d.t);
$('ie').textContent=d.e;$('cp').textContent=d.e;$('cs').textContent=T[lang].cs;$('ia').textContent=d.a;
$('im').textContent=d.m;$('im').classList.toggle('hd',!d.m);
$('idt').textContent=dt.toLocaleDateString(lang,{weekday:'long',month:'long',day:'numeric',year:'numeric'});
$('iti').textContent=dt.toLocaleTimeString(lang,{hour:'numeric',minute:'2-digit'});
$('ip').textContent=d.p;$('ic').textContent=d.c;$('icw').classList.toggle('hd',!d.c);
const ph=d.w.replace(/\D/g,'');$('ar').classList.toggle('hd',!ph);
if(d.r)$('ir').textContent=new Date(d.r+'T12:00').toLocaleDateString(lang,{month:'long',day:'numeric'});
$('irw').classList.toggle('hd',!d.r);
const end=new Date(dt.getTime()+3*3600e3);const ttl=(lang==='es'?'Cumple de ':'')+d.e+(lang==='en'?"'s birthday":'');
$('am').onclick=()=>openLink('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(d.p));
$('ac').onclick=()=>openLink('https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(ttl)+'&dates='+st(dt)+'/'+st(end)+'&location='+encodeURIComponent(d.p));
$('ar').onclick=()=>openLink('https://wa.me/'+ph+'?text='+encodeURIComponent(T[lang].rsvpMsg+' '+d.e+'. '+T[lang].name+': '));}
['fe','fa','fd','ft','fp'].forEach(i=>$(i).addEventListener('input',()=>$('er').classList.add('hd')));
$('bc').onclick=()=>{D={e:$('fe').value.trim(),a:$('fa').value.trim(),d:$('fd').value,t:$('ft').value,p:$('fp').value.trim(),m:$('fm').value.trim(),c:$('fc').value.trim(),r:$('fr').value,w:$('fw').value.trim()};
if(!D.e||!D.a||!D.d||!D.t||!D.p){$('er').classList.remove('hd');D=null;return;}
fill();$('cr').classList.add('hd');$('vw').classList.remove('hd');$('env').classList.remove('op');$('ew').classList.remove('hd');$('iv').classList.add('hd');$('iv').classList.remove('sh');};
$('env').onclick=()=>{$('env').classList.add('op');setTimeout(()=>{$('ew').classList.add('hd');$('iv').classList.remove('hd');requestAnimationFrame(()=>requestAnimationFrame(()=>$('iv').classList.add('sh')));},3100);};
$('bb').onclick=()=>{$('vw').classList.add('hd');$('cr').classList.remove('hd');};
paint();
</script>
