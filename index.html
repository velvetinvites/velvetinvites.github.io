function leaf(x,y,rot,sc){return '<g transform="translate('+x+' '+y+') rotate('+rot+') scale('+(sc||1)+')"><path d="M0,0 C4,-5 7,-3 9,-8 C11,-3 15,-5 18,-7 C17,-2 21,0 26,0 C21,0 17,2 18,7 C15,5 11,3 9,8 C7,3 4,5 0,0Z" fill="url(#lf)" stroke="#143522" stroke-width=".6"/><path d="M1,0 L24,0" stroke="#8cc29a" stroke-width=".6" opacity=".7"/></g>';}
function berry(x,y,r){r=r||4;return '<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="url(#bry)"/><circle cx="'+(x-r*.35)+'" cy="'+(y-r*.35)+'" r="'+(r*.28)+'" fill="#fff" opacity=".75"/>';}
function corner(){return sprig(2,2,.45,58,false)+sprig(4,6,1.1,48,true)+sprig(0,10,.12,44,true)+'<g filter="url(#ds3)">'+leaf(10,14,22)+leaf(18,26,70,.9)+leaf(22,8,-6,.8)+berry(30,20)+berry(37,25,3.6)+berry(27,28,3.4)+'</g>';}
$('spr').innerHTML=sprig(-16,-12,.55,52,false)+sprig(-12,-4,1.2,44,true)+sprig(-20,8,.15,42,true)+sprig(316,222,3.7,52,false)+sprig(312,214,4.35,44,true)+sprig(320,202,3.3,42,true)+'<g filter="url(#ds3)">'+leaf(-6,6,22)+leaf(2,18,72,.9)+berry(16,12)+berry(23,17,3.6)+berry(13,20,3.4)+leaf(306,204,202)+leaf(298,192,252,.9)+berry(284,198)+berry(277,193,3.6)+berry(287,190,3.4)+'</g>';
$('hol').innerHTML=leaf(56,90,-150,.9)+leaf(68,84,-108,.85)+leaf(50,100,170,.75)+berry(64,96,3.8)+berry(71,93,3.4)+berry(60,101,3.3);
$('cnL').innerHTML=corner();$('cnR').innerHTML=corner();
var ss='';[[30,60,1],[358,50,1.2],[350,250,.8],[24,280,1.1],[194,30,.9],[300,120,.7],[80,140,.6],[340,360,.9],[40,390,.7],[200,410,.6]].forEach(function(s,i){ss+='<path class="st" style="animation-delay:'+(i*.37).toFixed(2)+'s" transform="translate('+s[0]+' '+s[1]+') scale('+s[2]+')" d="M0,-7 L1.3,-1.3 L7,0 L1.3,1.3 L0,7 L-1.3,1.3 L-7,0 L-1.3,-1.3Z" fill="#F6DE95"/>';});$('stars').innerHTML=ss;
function paint(){document.querySelectorAll('[data-t]').forEach(function(e){e.textContent=T[lang][e.dataset.t];});document.querySelectorAll('.lg button').forEach(function(b){b.classList.toggle('on',b.dataset.l===lang);});document.documentElement.lang=lang;if(D)fill();}
document.querySelectorAll('.lg button').forEach(function(b){b.onclick=function(){lang=b.dataset.l;paint();};});
function fill(){var d=D,dt=new Date(d.d+'T'+(d.t||'19:00'));
$('ie').textContent=d.e;$('cp').textContent=d.e;$('cs').textContent=T[lang].cs;$('im').textContent=d.m||'';$('im').classList.toggle('hd',!d.m);
$('idt').textContent=dt.toLocaleDateString(lang,{weekday:'long',month:'long',day:'numeric',year:'numeric'});
$('iti').textContent=dt.toLocaleTimeString(lang,{hour:'numeric',minute:'2-digit'});
$('ih').textContent=d.h||'';$('ip').textContent=d.p;$('ic').textContent=d.c||'';$('icw').classList.toggle('hd',!d.c);
$('si').textContent=(d.h||d.e).trim().charAt(0).toUpperCase();
var ph=(d.w||'').replace(/\D/g,'');$('ar').classList.toggle('hd',!ph);
if(d.r)$('ir').textContent=new Date(d.r+'T12:00').toLocaleDateString(lang,{month:'long',day:'numeric'});
$('irw').classList.toggle('hd',!d.r);
var end=new Date(dt.getTime()+4*3600e3);
$('am').href='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(d.p);
$('ac').href='https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(d.e)+'&dates='+st(dt)+'/'+st(end)+'&location='+encodeURIComponent(d.p);
$('ar').href='https://wa.me/'+ph+'?text='+encodeURIComponent(T[lang].rsvpMsg+' "'+d.e+'". '+T[lang].name+': ');
document.title=d.e;}
var q=new URLSearchParams(location.search).get('i');
if(q){try{D=dec(q);lang=D.l||lang;}catch(e){D=null;}}
paint();
if(D){$('vw').classList.remove('hd');
$('env').onclick=function(){$('env').classList.add('op');setTimeout(function(){$('ew').classList.add('hd');$('iv').classList.remove('hd');requestAnimationFrame(function(){requestAnimationFrame(function(){$('iv').classList.add('sh');});});},3100);};
}else{$('cr').classList.remove('hd');}
['fe','fh','fd','ft','fp'].forEach(function(i){$(i).addEventListener('input',function(){$('er').classList.add('hd');});});
$('bc').onclick=function(){var o={e:$('fe').value.trim(),h:$('fh').value.trim(),d:$('fd').value,t:$('ft').value,p:$('fp').value.trim(),m:$('fm').value.trim(),c:$('fc').value.trim(),r:$('fr').value,w:$('fw').value.trim(),l:lang};
if(!o.e||!o.d||!o.t||!o.p){$('er').classList.remove('hd');return;}
Object.keys(o).forEach(function(k){if(!o[k])delete o[k];});
var url=location.origin+location.pathname+'?i='+enc(o);
$('link').textContent=url;$('bp').href=url;$('bs').href='https://wa.me/?text='+encodeURIComponent((lang==='es'?'\u2728 Est\u00e1s invitado a ':'\u2728 You\'re invited to ')+o.e+'\n'+(lang==='es'?'Toca el enlace para abrir tu invitaci\u00f3n:':'Tap the link to open your invitation:')+'\n'+url);
$('out').classList.remove('hd');$('out').scrollIntoView({behavior:'smooth'});};
$('bk').onclick=function(){navigator.clipboard.writeText($('link').textContent).then(function(){$('bk').textContent=T[lang].copied;});};
