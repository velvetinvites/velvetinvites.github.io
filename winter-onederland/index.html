const face=(r,dx,dy,bk)=>'<g transform="translate('+(dx||0)+' '+(dy||0)+')"><g class="ey"><ellipse cx="'+(-r*.32)+'" cy="'+(-r*.05)+'" rx="'+(r*.13)+'" ry="'+(r*.2)+'" fill="'+O+'"/><ellipse cx="'+(r*.32)+'" cy="'+(-r*.05)+'" rx="'+(r*.13)+'" ry="'+(r*.2)+'" fill="'+O+'"/><circle cx="'+(-r*.36)+'" cy="'+(-r*.13)+'" r="'+(r*.06)+'" fill="#fff"/><circle cx="'+(r*.28)+'" cy="'+(-r*.13)+'" r="'+(r*.06)+'" fill="#fff"/></g><ellipse cx="'+(-r*.55)+'" cy="'+(r*.2)+'" rx="'+(r*.14)+'" ry="'+(r*.08)+'" fill="#ff8fb3" opacity=".85"/><ellipse cx="'+(r*.55)+'" cy="'+(r*.2)+'" rx="'+(r*.14)+'" ry="'+(r*.08)+'" fill="#ff8fb3" opacity=".85"/>'+(bk?'<path d="M'+(-r*.12)+','+(r*.14)+' L0,'+(r*.3)+' L'+(r*.12)+','+(r*.14)+'Z" fill="#ffb347" stroke="'+O+'" stroke-width="1"/>':'<path d="M'+(-r*.14)+','+(r*.18)+' Q0,'+(r*.34)+' '+(r*.14)+','+(r*.18)+'" fill="none" stroke="'+O+'" stroke-width="'+Math.max(1.2,r*.07)+'" stroke-linecap="round"/>')+'</g>';
function flake(x,y,s,c,anim,d){let g='<g transform="translate('+x+' '+y+') scale('+s+')"><g'+(anim?' class="st" style="animation-delay:'+d+'s"':'')+'>';for(let k=0;k<6;k++){g+='<g transform="rotate('+(k*60)+')"><path d="M-2,0 L-2,-11 L0,-14 L2,-11 L2,0Z" fill="'+(c||'#fff')+'" stroke="'+O+'" stroke-width="1.4" stroke-linejoin="round"/><path d="M0,-7 L-4,-10 M0,-7 L4,-10" stroke="'+O+'" stroke-width="1.4" stroke-linecap="round"/></g>';}g+='<circle r="3" fill="'+(c||'#fff')+'" stroke="'+O+'" stroke-width="1.4"/></g></g>';return g;}
function snowman(x,y,s,rot){return '<g class="fly"><g transform="translate('+x+' '+y+') rotate('+rot+') scale('+s+')"><path class="arm" d="M12,4 L26,-6 M22,-3 L26,-10" stroke="#7a4a2a" stroke-width="2.5" stroke-linecap="round" fill="none"/><path d="M-12,4 L-24,-4" stroke="#7a4a2a" stroke-width="2.5" stroke-linecap="round"/><circle cy="18" r="17" fill="#fff" stroke="'+O+'" stroke-width="2.5"/><circle cy="-6" r="13" fill="#fff" stroke="'+O+'" stroke-width="2.5"/><path d="M-12,2 Q0,9 12,2 L12,6 Q0,13 -12,6Z" fill="#ff5a7a" stroke="'+O+'" stroke-width="2"/><path d="M6,6 L10,18 L15,16 L11,5Z" fill="#ff5a7a" stroke="'+O+'" stroke-width="2" stroke-linejoin="round"/><path d="M-11,-16 L11,-16 L9,-34 L-9,-34Z" fill="#3a5a9a" stroke="'+O+'" stroke-width="2.5" stroke-linejoin="round"/><rect x="-15" y="-18" width="30" height="5" rx="2" fill="#3a5a9a" stroke="'+O+'" stroke-width="2.5"/><circle cy="14" r="2" fill="'+O+'"/><circle cy="22" r="2" fill="'+O+'"/>'+face(13,0,-6,true)+'</g></g>';}
function penguin(x,y,s,rot){return '<g class="fly" style="animation-delay:.7s"><g transform="translate('+x+' '+y+') rotate('+rot+') scale('+s+')"><ellipse cx="-8" cy="20" rx="7" ry="3.5" fill="#ffb347" stroke="'+O+'" stroke-width="2"/><ellipse cx="8" cy="20" rx="7" ry="3.5" fill="#ffb347" stroke="'+O+'" stroke-width="2"/><ellipse cy="2" rx="17" ry="20" fill="#2a3f7a" stroke="'+O+'" stroke-width="2.5"/><ellipse cy="6" rx="11" ry="14" fill="#fff"/><path class="arm" d="M14,-2 Q24,4 20,14" fill="#2a3f7a" stroke="'+O+'" stroke-width="2.5"/><path d="M-12,-14 Q0,-26 12,-14 L13,-10 L-13,-10Z" fill="#ff5a7a" stroke="'+O+'" stroke-width="2" stroke-linejoin="round"/><circle cy="-25" r="4" fill="#fff" stroke="'+O+'" stroke-width="2"/>'+face(11,0,-2,true)+'</g></g>';}

bg+='<path d="M0,440 Q60,400 130,418 Q200,436 260,412 Q330,390 388,420 L388,440Z" fill="#fff" stroke="'+O+'" stroke-width="2.5"/>';$('bgs').innerHTML=bg;

function burst(a){let p=[];for(let i=0;i<24;i++){const ang=i/24*Math.PI*2,r=i%2?46:58;p.push((Math.cos(ang)*r).toFixed(1)+','+(Math.sin(ang)*r).toFixed(1));}
let g='';for(let k=0;k<6;k++)g+='<path d="M-3,0 L-3,-34 L0,-40 L3,-34 L3,0Z" fill="#fff" stroke="'+O+'" stroke-width="2" transform="rotate('+(k*60)+')"/>';
return '<path d="M'+p.join('L')+'Z" fill="#dff3ff" stroke="'+O+'" stroke-width="3" stroke-linejoin="round"/>'+g+'<circle r="30" fill="#5ab8ff" stroke="'+O+'" stroke-width="3"/><path d="M-22,-10 A24,24 0 0 1 -8,-24" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/><text y="8" text-anchor="middle" font-family="Mochiy Pop One, sans-serif" font-size="'+(String(a).length>1?28:36)+'" fill="#fff" stroke="'+O+'" stroke-width="2.5" paint-order="stroke">'+a+'</text><text y="22" text-anchor="middle" font-family="Fredoka, sans-serif" font-weight="600" font-size="9" fill="#fff" stroke="'+O+'" stroke-width="2" paint-order="stroke">'+(a==='1'?T[lang].years:T[lang].yearsP)+'</text>';}
let AC=null;
function chime(){if(!sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const t0=AC.currentTime;[1318.5,1568,1975.5,2637,3136].forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,t0+i*.11);g.gain.linearRampToValueAtTime(.16,t0+i*.11+.02);g.gain.exponentialRampToValueAtTime(.001,t0+i*.11+1.5);o.connect(g);g.connect(AC.destination);o.start(t0+i*.11);o.stop(t0+i*.11+1.6);});
for(let i=0;i<14;i++){const o=AC.createOscillator(),g=AC.createGain(),t=t0+.4+i*.07;o.type='sine';o.frequency.value=3000+Math.random()*3000;g.gain.setValueAtTime(.04,t);g.gain.exponentialRampToValueAtTime(.001,t+.3);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+.35);}}catch(e){}}
function boom(){const box=$('pts');box.innerHTML='';const shapes=[c=>flake(14,14,.9,c),c=>spark(14,14,.8,c)];const cols=['#fff','#dff3ff','#a58aff','#5ab8ff'];
for(let i=0;i<36;i++){const a=Math.random()*Math.PI*2,d=110+Math.random()*170;const el=document.createElement('div');el.className='pt';el.style.setProperty('--x',(Math.cos(a)*d).toFixed(0)+'px');el.style.setProperty('--y',(Math.sin(a)*d-40).toFixed(0)+'px');el.style.setProperty('--r',(Math.random()*720-360).toFixed(0)+'deg');el.style.animationDelay=(Math.random()*.25).toFixed(2)+'s';el.innerHTML='<svg width="28" height="28" style="overflow:visible">'+shapes[i%2](cols[i%4])+'</svg>';box.appendChild(el);}}
function clearT(){tm.forEach(clearTimeout);tm=[];}
function startCine(){clearT();ready=false;opened=false;const s=$('ew');s.className='stg';$('env').classList.remove('op');$('ew').classList.remove('hd');$('iv').classList.add('hd');$('iv').classList.remove('sh');$('pts').innerHTML='';void s.offsetWidth;s.classList.add('cine');tm.push(setTimeout(()=>{s.classList.add('go');},3800));tm.push(setTimeout(()=>{ready=true;},5000));}
function paint(){document.querySelectorAll('[data-t]').forEach(e=>e.textContent=T[lang][e.dataset.t]);document.querySelectorAll('.lg button').forEach(b=>b.classList.toggle('on',b.dataset.l===lang));$('snd').textContent=sound?T[lang].son:T[lang].soff;if(D)fill();}

function fill(){const d=D,dt=new Date(d.d+'T'+d.t);
$('ie').textContent=d.e+'!';$('cp').textContent=d.e;$('cs').textContent=T[lang].cs;$('burst').innerHTML=burst(d.a.replace(/[^0-9]/g,'').slice(0,2));

$('iti').textContent=dt.toLocaleTimeString(lang,{hour:'numeric',minute:'2-digit'});

if(d.r)$('ir').textContent=new Date(d.r+'T12:00').toLocaleDateString(lang,{month:'long',day:'numeric'});
$('irw').classList.toggle('hd',!d.r);
const end=new Date(dt.getTime()+3*3600e3);const ttl=(lang==='es'?'Cumple de ':'')+d.e+(lang==='en'?"'s birthday":'');
$('am').onclick=()=>openLink('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(d.p));
$('ac').onclick=()=>openLink('https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(ttl)+'&dates='+stp(dt)+'/'+stp(end)+'&location='+encodeURIComponent(d.p));

fill();$('cr').classList.add('hd');$('vw').classList.remove('hd');startCine();};
