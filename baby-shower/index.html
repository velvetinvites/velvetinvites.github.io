const face=(r,dx,dy)=>'<g transform="translate('+(dx||0)+' '+(dy||0)+')"><g class="ey"><ellipse cx="'+(-r*.32)+'" cy="'+(-r*.08)+'" rx="'+(r*.1)+'" ry="'+(r*.14)+'" fill="'+O+'"/><ellipse cx="'+(r*.32)+'" cy="'+(-r*.08)+'" rx="'+(r*.1)+'" ry="'+(r*.14)+'" fill="'+O+'"/></g><ellipse cx="'+(-r*.55)+'" cy="'+(r*.16)+'" rx="'+(r*.13)+'" ry="'+(r*.08)+'" fill="#e8a49c" opacity=".8"/><ellipse cx="'+(r*.55)+'" cy="'+(r*.16)+'" rx="'+(r*.13)+'" ry="'+(r*.08)+'" fill="#e8a49c" opacity=".8"/></g>';
function bear(x,y,s,c){c=c||'#c99a6e';return '<g transform="translate('+x+' '+y+') scale('+s+')"><circle cx="-13" cy="-13" r="7" fill="'+c+'" stroke="'+O+'" stroke-width="2"/><circle cx="13" cy="-13" r="7" fill="'+c+'" stroke="'+O+'" stroke-width="2"/><circle cx="-13" cy="-13" r="3.5" fill="#efc9a6"/><circle cx="13" cy="-13" r="3.5" fill="#efc9a6"/><circle r="16" fill="'+c+'" stroke="'+O+'" stroke-width="2"/><ellipse cy="6" rx="7.5" ry="5.5" fill="#efc9a6" stroke="'+O+'" stroke-width="1.5"/><ellipse cy="3.5" rx="2.6" ry="1.9" fill="'+O+'"/><path d="M-2.5,7.5 Q0,9.5 2.5,7.5" fill="none" stroke="'+O+'" stroke-width="1.3" stroke-linecap="round"/>'+face(16,0,-2)+'</g>';}
function balloonBear(x,y,s,d){return '<g class="fly" style="animation-delay:'+d+'s"><g transform="translate('+x+' '+y+') scale('+s+')"><g class="swg"><path d="M0,-44 Q-6,-20 0,0" stroke="'+O+'" stroke-width="1.4" fill="none"/><ellipse cx="0" cy="-62" rx="15" ry="18" fill="#e8b4b0" stroke="'+O+'" stroke-width="2"/><path d="M-3,-44 L3,-44 L0,-40Z" fill="#e8b4b0" stroke="'+O+'" stroke-width="1.5"/><ellipse cx="-6" cy="-68" rx="4" ry="6" fill="#fff" opacity=".6"/>'+bear(0,14,.9)+'<ellipse cx="-8" cy="34" rx="7" ry="5" fill="#c99a6e" stroke="'+O+'" stroke-width="2"/><ellipse cx="8" cy="34" rx="7" ry="5" fill="#c99a6e" stroke="'+O+'" stroke-width="2"/></g></g></g>';}
$('bear').innerHTML=bear(0,2,.82,'#e9c79e');
$('envst').innerHTML=star(46,172,.7)+star(254,164,.6)+cloud(232,40,.35)+cloud(66,36,.3);
$('spr').innerHTML=cloud(4,8,.8)+star(36,-10,.7,'#f2c46d',1,0)+cloud(296,204,.75)+balloonBear(262,-28,.85,0)+star(20,232,.8,'#f2c46d',1,.5);
let bg='';[[36,90,1],[352,90,1.2],[352,262,.8],[26,300,1.1],[196,72,.8],[306,140,.7],[86,160,.6],[340,374,.9],[44,380,.7]].forEach((s,i)=>{bg+=star(s[0],s[1],s[2],i%2?'#f2c46d':'#fff',1,(i*.3).toFixed(2));});
bg+='<g transform="translate(330 300)"><path d="M-14,-10 A16,16 0 1 0 6,14 A12,12 0 1 1 -14,-10Z" fill="#f6e2b0" stroke="'+O+'" stroke-width="2"/></g>';$('bgs').innerHTML=bg;
$('cnL').innerHTML=cloud(44,52,1)+star(92,28,.8,'#f2c46d',1,0)+star(18,22,.6,'#f2c46d',1,.6);
$('cnR').innerHTML=balloonBear(70,70,.85,.4)+cloud(28,86,.6);
let AC=null;
function chime(){if(!sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const t0=AC.currentTime;[784,988,1175,1568,1175,1568].forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(0,t0+i*.18);g.gain.linearRampToValueAtTime(.14,t0+i*.18+.02);g.gain.exponentialRampToValueAtTime(.001,t0+i*.18+1.1);o.connect(g);g.connect(AC.destination);o.start(t0+i*.18);o.stop(t0+i*.18+1.2);});}catch(e){}}
function boom(){const box=$('pts');box.innerHTML='';const heart=c=>'<path transform="translate(14 14)" d="M0,8 C-11,1 -9,-8 -4,-7.5 C-2,-7.4 -.8,-6 0,-4.5 C.8,-6 2,-7.4 4,-7.5 C9,-8 11,1 0,8Z" fill="'+c+'" stroke="'+O+'" stroke-width="1.5"/>';const shapes=[c=>star(14,14,.9,c),c=>heart(c),c=>cloud(14,14,.35,'#fff')];const cols=['#f2c46d','#e8b4b0','#9cb79e','#fff'];
for(let i=0;i<30;i++){const a=Math.random()*Math.PI*2,d=110+Math.random()*160;const el=document.createElement('div');el.className='pt';el.style.setProperty('--x',(Math.cos(a)*d).toFixed(0)+'px');el.style.setProperty('--y',(Math.sin(a)*d-40).toFixed(0)+'px');el.style.setProperty('--r',(Math.random()*400-200).toFixed(0)+'deg');el.style.animationDelay=(Math.random()*.25).toFixed(2)+'s';el.innerHTML='<svg width="28" height="28" style="overflow:visible">'+shapes[i%3](cols[i%4])+'</svg>';box.appendChild(el);}}
function clearT(){tm.forEach(clearTimeout);tm=[];}
function startCine(){clearT();ready=false;opened=false;const s=$('ew');s.className='stg';$('env').classList.remove('op');$('ew').classList.remove('hd');$('iv').classList.add('hd');$('iv').classList.remove('sh');$('pts').innerHTML='';void s.offsetWidth;s.classList.add('cine');tm.push(setTimeout(()=>{s.classList.add('go');},3800));tm.push(setTimeout(()=>{ready=true;},5200));}
function tick(){if(!D)return;const t=new Date(D.d+'T'+D.t)-new Date();const x=Math.max(0,t);$('cdd').textContent=Math.floor(x/864e5);$('cdh').textContent=Math.floor(x/36e5)%24;$('cdm').textContent=Math.floor(x/6e4)%60;}
function paint(){document.querySelectorAll('[data-t]').forEach(e=>e.textContent=T[lang][e.dataset.t]);document.querySelectorAll('.lg button').forEach(b=>b.classList.toggle('on',b.dataset.l===lang));$('snd').textContent=sound?T[lang].son:T[lang].soff;if(D)fill();}
document.querySelectorAll('.lg button').forEach(b=>b.onclick=()=>{lang=b.dataset.l;paint();});
$('snd').onclick=()=>{sound=!sound;paint();};
function fill(){const d=D,dt=new Date(d.d+'T'+d.t);
$('ie').textContent=d.e;$('cp').textContent=d.e;$('cs').textContent=T[lang].cs;
$('im').textContent=d.m;$('im').classList.toggle('hd',!d.m);
$('idt').textContent=dt.toLocaleDateString(lang,{weekday:'long',month:'long',day:'numeric',year:'numeric'});
$('iti').textContent=dt.toLocaleTimeString(lang,{hour:'numeric',minute:'2-digit'});
$('ip').textContent=d.p;
const ph=d.w.replace(/\D/g,'');$('ar').classList.toggle('hd',!ph);
if(d.r)$('ir').textContent=new Date(d.r+'T12:00').toLocaleDateString(lang,{month:'long',day:'numeric'});
$('irw').classList.toggle('hd',!d.r);
const end=new Date(dt.getTime()+3*3600e3);const ttl='Baby shower '+d.e;
$('am').onclick=()=>openLink('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(d.p));
$('ac').onclick=()=>openLink('https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(ttl)+'&dates='+stp(dt)+'/'+stp(end)+'&location='+encodeURIComponent(d.p));
$('ar').onclick=()=>openLink('https://wa.me/'+ph+'?text='+encodeURIComponent(T[lang].rsvpMsg+' '+d.e+'. '+T[lang].name+': '));
tick();}
['fe','fd','ft','fp'].forEach(i=>$(i).addEventListener('input',()=>$('er').classList.add('hd')));
$('bc').onclick=()=>{D={e:$('fe').value.trim(),d:$('fd').value,t:$('ft').value,p:$('fp').value.trim(),m:$('fm').value.trim(),r:$('fr').value,w:$('fw').value.trim()};
if(!D.e||!D.d||!D.t||!D.p){$('er').classList.remove('hd');D=null;return;}
fill();clearInterval(cdi);cdi=setInterval(tick,30000);$('cr').classList.add('hd');$('vw').classList.remove('hd');startCine();};
$('env').onclick=()=>{if(!ready||opened)return;opened=true;const s=$('ew');chime();s.classList.add('zm');$('fls').classList.remove('on');void $('fls').offsetWidth;$('fls').classList.add('on');boom();$('env').classList.add('op');
tm.push(setTimeout(()=>{s.classList.remove('cine');},2300));
tm.push(setTimeout(()=>{s.classList.add('hd');$('iv').classList.remove('hd');requestAnimationFrame(()=>requestAnimationFrame(()=>$('iv').classList.add('sh')));},3000));};
$('rp').onclick=()=>startCine();
$('bb').onclick=()=>{clearT();$('vw').classList.add('hd');$('cr').classList.remove('hd');};
paint();
</script>
