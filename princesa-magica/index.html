function flower(x,y,r,c,fc){let o='<g transform="translate('+x+' '+y+')">';for(let i=0;i<5;i++){o+='<ellipse cx="0" cy="'+(-r*.95)+'" rx="'+(r*.62)+'" ry="'+(r*.8)+'" transform="rotate('+(i*72)+')" fill="'+c+'" stroke="'+O+'" stroke-width="2.2"/>';}o+='<circle r="'+(r*.72)+'" fill="#ffe27a" stroke="'+O+'" stroke-width="2.2"/>';if(fc)o+=face(r*.72,0,0);else o+='<circle cx="'+(-r*.22)+'" cy="'+(-r*.22)+'" r="'+(r*.15)+'" fill="#fff"/>';return o+'</g>';}
function leaf(x,y,rot,s){return '<path transform="translate('+x+' '+y+') rotate('+rot+') scale('+(s||1)+')" d="M0,0 C6,-8 18,-8 24,0 C18,8 6,8 0,0Z" fill="#6fe0c0" stroke="'+O+'" stroke-width="2"/>';}
function heart(x,y,s,c,anim){return '<g transform="translate('+x+' '+y+') scale('+s+')"><g'+(anim?' class="hrt"':'')+'><path d="M0,10 C-14,1 -11,-10 -5,-9.5 C-2.5,-9.3 -1,-7.5 0,-5.5 C1,-7.5 2.5,-9.3 5,-9.5 C11,-10 14,1 0,10Z" fill="'+(c||'#ff7ab6')+'" stroke="'+O+'" stroke-width="2" stroke-linejoin="round"/><ellipse cx="-5" cy="-4" rx="2.2" ry="1.5" fill="#fff" transform="rotate(-30 -5 -4)"/></g></g>';}
function bfly(x,y,s,rot,d,c){c=c||'#b98aff';return '<g class="fly" style="animation-delay:'+d+'s"><g transform="translate('+x+' '+y+') rotate('+rot+') scale('+s+')"><g class="wg" style="animation-delay:'+d+'s"><path d="M0,0 C-10,-16 -24,-8 -16,2 C-22,10 -8,14 0,2Z" fill="'+c+'" stroke="'+O+'" stroke-width="2" stroke-linejoin="round"/><path d="M0,0 C10,-16 24,-8 16,2 C22,10 8,14 0,2Z" fill="'+c+'" stroke="'+O+'" stroke-width="2" stroke-linejoin="round"/><circle cx="-10" cy="-5" r="3" fill="#fff"/><circle cx="10" cy="-5" r="3" fill="#fff"/></g><ellipse cx="0" cy="0" rx="2.5" ry="7" fill="'+O+'"/></g></g>';}
function wand(x,y,s,rot){return '<g class="fly"><g transform="translate('+x+' '+y+') rotate('+rot+') scale('+s+')"><rect x="-2.5" y="0" width="5" height="40" rx="2.5" fill="#fff" stroke="'+O+'" stroke-width="2"/><path d="M-2.5,8 L2.5,5 M-2.5,18 L2.5,15 M-2.5,28 L2.5,25" stroke="#ff7ab6" stroke-width="2"/><path d="M0,-18 L4.5,-7 L16,-6 L7,1 L10,12 L0,6 L-10,12 L-7,1 L-16,-6 L-4.5,-7Z" fill="#ffd84a" stroke="'+O+'" stroke-width="2.2" stroke-linejoin="round"/>'+face(9,0,-3)+'</g></g>';}
const dots=(n,w,h)=>{let o='';const cs=['#fff','#ffe27a','#fff'];for(let i=0;i<n;i++)o+='<circle cx="'+(rnd()*w).toFixed(1)+'" cy="'+(rnd()*h).toFixed(1)+'" r="'+(rnd()*1.3+.5).toFixed(2)+'" fill="'+cs[i%3]+'" opacity="'+(rnd()*.6+.4).toFixed(2)+'"/>';return o;};
const cluster=()=>leaf(-10,4,-20)+leaf(4,22,60,.9)+flower(8,8,14,'#ff7ab6',true)+flower(34,-6,9,'#b98aff')+flower(-8,30,8,'#ffb3d9');
$('envst').innerHTML=heart(46,172,.7,'#ff7ab6')+heart(254,164,.6,'#b98aff')+spark(230,40,.4,'#fff')+spark(64,40,.35,'#ffe27a')+dots(14,300,210);
$('flst').innerHTML=heart(60,24,.55,'#fff')+heart(240,22,.55,'#fff')+spark(150,30,.35,'#ffe27a');
$('hol').innerHTML=flower(52,94,7,'#ff7ab6')+flower(64,88,5,'#fff');
$('spr').innerHTML='<g transform="translate(0 2)">'+cluster()+'</g><g transform="translate(298 210) rotate(180)">'+cluster()+'</g>'+wand(262,-34,1,28)+bfly(30,234,.9,-15,.6,'#6fe0c0');
let bg=dots(60,388,440);[[36,90,1],[352,80,1.2],[352,262,.8],[26,300,1.1],[196,70,.8],[306,138,.7],[86,158,.6],[340,374,.9],[44,380,.7],[204,392,.6]].forEach((s,i)=>{bg+=spark(s[0],s[1],s[2],i%2?'#ffe27a':'#fff',1,(i*.3).toFixed(2));});
bg+=heart(60,120,1.1,'#ff7ab6',1)+heart(334,330,1,'#fff',1)+bfly(330,130,1,15,0,'#ffb3d9')+bfly(54,340,.9,-10,1.3,'#6fe0c0');$('bgs').innerHTML=bg;
$('cnL').innerHTML='<g transform="translate(26 30)">'+cluster()+'</g>'+heart(92,26,.8,'#ff7ab6',1)+spark(16,82,.5,'#ffe27a',1,.6);
$('cnR').innerHTML=wand(70,46,1.2,30)+bfly(26,72,.8,-10,.4,'#b98aff');
function burst(a){let p=[];for(let i=0;i<24;i++){const ang=i/24*Math.PI*2,r=i%2?46:58;p.push((Math.cos(ang)*r).toFixed(1)+','+(Math.sin(ang)*r).toFixed(1));}
return '<path d="M'+p.join('L')+'Z" fill="#ffd84a" stroke="'+O+'" stroke-width="3" stroke-linejoin="round"/><path d="M0,38 C-50,10 -42,-36 -18,-34 C-9,-33 -3,-27 0,-20 C3,-27 9,-33 18,-34 C42,-36 50,10 0,38Z" fill="#ff7ab6" stroke="'+O+'" stroke-width="3" stroke-linejoin="round"/><path d="M-30,-14 A26,26 0 0 1 -16,-28" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/><text y="8" text-anchor="middle" font-family="Mochiy Pop One, sans-serif" font-size="'+(String(a).length>1?32:40)+'" fill="#fff" stroke="'+O+'" stroke-width="2.5" paint-order="stroke">'+a+'</text><text y="24" text-anchor="middle" font-family="Fredoka, sans-serif" font-weight="600" font-size="11" fill="#fff" stroke="'+O+'" stroke-width="2" paint-order="stroke">'+T[lang].years+'</text>';}
let AC=null;
function chime(){if(!sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const t0=AC.currentTime;[1046.5,1318.5,1568,2093,2637].forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,t0+i*.09);g.gain.linearRampToValueAtTime(.18,t0+i*.09+.02);g.gain.exponentialRampToValueAtTime(.001,t0+i*.09+1.2);o.connect(g);g.connect(AC.destination);o.start(t0+i*.09);o.stop(t0+i*.09+1.3);});
for(let i=0;i<10;i++){const o=AC.createOscillator(),g=AC.createGain(),t=t0+.5+i*.06;o.type='triangle';o.frequency.value=2500+Math.random()*2500;g.gain.setValueAtTime(.05,t);g.gain.exponentialRampToValueAtTime(.001,t+.25);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+.3);}}catch(e){}}
function boom(){const box=$('pts');box.innerHTML='';const shapes=[c=>heart(14,14,.9,c),c=>spark(14,14,.8,c),c=>flower(14,14,7,c)];const cols=['#ff7ab6','#b98aff','#ffe27a','#6fe0c0','#fff'];
for(let i=0;i<34;i++){const a=Math.random()*Math.PI*2,d=110+Math.random()*170;const el=document.createElement('div');el.className='pt';el.style.setProperty('--x',(Math.cos(a)*d).toFixed(0)+'px');el.style.setProperty('--y',(Math.sin(a)*d-40).toFixed(0)+'px');el.style.setProperty('--r',(Math.random()*720-360).toFixed(0)+'deg');el.style.animationDelay=(Math.random()*.25).toFixed(2)+'s';el.innerHTML='<svg width="28" height="28" style="overflow:visible">'+shapes[i%3](cols[i%5])+'</svg>';box.appendChild(el);}}
function clearT(){tm.forEach(clearTimeout);tm=[];}
function startCine(){clearT();ready=false;opened=false;const s=$('ew');s.className='stg';$('env').classList.remove('op');$('ew').classList.remove('hd');$('iv').classList.add('hd');$('iv').classList.remove('sh');$('pts').innerHTML='';void s.offsetWidth;s.classList.add('cine');tm.push(setTimeout(()=>{s.classList.add('go');},3800));tm.push(setTimeout(()=>{ready=true;},5000));}
function paint(){document.querySelectorAll('[data-t]').forEach(e=>e.textContent=T[lang][e.dataset.t]);document.querySelectorAll('.lg button').forEach(b=>b.classList.toggle('on',b.dataset.l===lang));$('snd').textContent=sound?T[lang].son:T[lang].soff;if(D)fill();}
document.querySelectorAll('.lg button').forEach(b=>b.onclick=()=>{lang=b.dataset.l;paint();});
$('snd').onclick=()=>{sound=!sound;paint();};
function fill(){const d=D,dt=new Date(d.d+'T'+d.t);
$('ie').textContent=d.e+'!';$('cp').textContent=d.e;$('cs').textContent=T[lang].cs;$('burst').innerHTML=burst(d.a.replace(/[^0-9]/g,'').slice(0,2));
$('im').textContent=d.m;$('im').classList.toggle('hd',!d.m);
$('idt').textContent=dt.toLocaleDateString(lang,{weekday:'long',month:'long',day:'numeric',year:'numeric'});
$('iti').textContent=dt.toLocaleTimeString(lang,{hour:'numeric',minute:'2-digit'});
$('ip').textContent=d.p;$('ic').textContent=d.c;$('icw').classList.toggle('hd',!d.c);
const ph=d.w.replace(/\D/g,'');$('ar').classList.toggle('hd',!ph);
if(d.r)$('ir').textContent=new Date(d.r+'T12:00').toLocaleDateString(lang,{month:'long',day:'numeric'});
$('irw').classList.toggle('hd',!d.r);
const end=new Date(dt.getTime()+3*3600e3);const ttl=(lang==='es'?'Cumple de ':'')+d.e+(lang==='en'?"'s birthday":'');
$('am').onclick=()=>openLink('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(d.p));
$('ac').onclick=()=>openLink('https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(ttl)+'&dates='+stp(dt)+'/'+stp(end)+'&location='+encodeURIComponent(d.p));
$('ar').onclick=()=>openLink('https://wa.me/'+ph+'?text='+encodeURIComponent(T[lang].rsvpMsg+' '+d.e+'. '+T[lang].name+': '));}
['fe','fa','fd','ft','fp'].forEach(i=>$(i).addEventListener('input',()=>$('er').classList.add('hd')));
$('bc').onclick=()=>{D={e:$('fe').value.trim(),a:$('fa').value.trim(),d:$('fd').value,t:$('ft').value,p:$('fp').value.trim(),m:$('fm').value.trim(),c:$('fc').value.trim(),r:$('fr').value,w:$('fw').value.trim()};
if(!D.e||!D.a||!D.d||!D.t||!D.p){$('er').classList.remove('hd');D=null;return;}
fill();$('cr').classList.add('hd');$('vw').classList.remove('hd');startCine();};
$('env').onclick=()=>{if(!ready||opened)return;opened=true;const s=$('ew');chime();s.classList.add('zm');$('fls').classList.remove('on');void $('fls').offsetWidth;$('fls').classList.add('on');boom();$('env').classList.add('op');
tm.push(setTimeout(()=>{s.classList.remove('cine');},2300));
tm.push(setTimeout(()=>{s.classList.add('hd');$('iv').classList.remove('hd');requestAnimationFrame(()=>requestAnimationFrame(()=>$('iv').classList.add('sh')));},3000));};
$('rp').onclick=()=>startCine();
$('bb').onclick=()=>{clearT();$('vw').classList.add('hd');$('cr').classList.remove('hd');};
paint();
</script>
